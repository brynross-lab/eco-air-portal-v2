<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Air — AI Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: contractor job sheet — brand bar, job header with live totals, tabbed working sheet; price book is its own view */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --surface2:#e8eee7; --line:#d2dbd1; --fg:#15211a; --muted:#5a695f;
  --brand:#1c5534; --brand-ink:#ffffff; --brand-soft:#dcebe0; --accent:#1c6b3d;
  --est-bg:#fff2c6; --est-fg:#6f4c00; --est-line:#e8bf4f;
  --miss-bg:#fde3df; --miss-fg:#972a1d; --miss-line:#e59a8e;
  --ok-bg:#dff1e4; --ok-fg:#1b6634;
  --info-bg:#e3ecf7; --info-fg:#2a527f;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201a; --surface2:#1d2a22; --line:#2d3b32; --fg:#e3ebe5; --muted:#99a99e;
  --brand:#1f5f39; --brand-ink:#ffffff; --brand-soft:#1d3527; --accent:#74d095;
  --est-bg:#3a2f0e; --est-fg:#f4cf6a; --est-line:#7d621d;
  --miss-bg:#3e1913; --miss-fg:#f2a294; --miss-line:#7d3428;
  --ok-bg:#15351f; --ok-fg:#80d99b; --info-bg:#172839; --info-fg:#93bae4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201a; --surface2:#1d2a22; --line:#2d3b32; --fg:#e3ebe5; --muted:#99a99e;
  --brand:#1f5f39; --brand-ink:#ffffff; --brand-soft:#1d3527; --accent:#74d095;
  --est-bg:#3a2f0e; --est-fg:#f4cf6a; --est-line:#7d621d;
  --miss-bg:#3e1913; --miss-fg:#f2a294; --miss-line:#7d3428;
  --ok-bg:#15351f; --ok-fg:#80d99b; --info-bg:#172839; --info-fg:#93bae4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.04em;border:2px solid currentColor;border-radius:6px;padding:0 8px;line-height:1.3}
.logo-sub{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.03em;opacity:.9}
.top .grow{flex:1}
.top select,.top button{font:inherit}
.top select{background:rgba(255,255,255,.12);color:var(--brand-ink);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 8px;max-width:260px}
.top select option{color:#15211a;background:#fff}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:var(--brand-ink)}
.top .btn.solid{background:var(--brand-ink);color:#1c5534;border-color:var(--brand-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.jobhead{display:grid;gap:12px}
.jobhead .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:grid;gap:3px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--font-mono)}
textarea{width:100%;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:6px;padding:8px 10px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.warn .v{color:var(--est-fg)} .stat.bad .v{color:var(--miss-fg)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);padding:9px 14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--font-mono);font-size:11px;background:var(--est-bg);color:var(--est-fg);border-radius:9px;padding:0 6px;margin-left:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td input[type=number]{width:90px;text-align:right}
td input.qty{width:64px}
tr.estimated td{background:var(--est-bg)}
tr.missing td{background:var(--miss-bg)}
tr.excluded td{opacity:.45}
tr.estimated td:first-child{box-shadow:inset 3px 0 0 var(--est-line)}
tr.missing td:first-child{box-shadow:inset 3px 0 0 var(--miss-line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.chip.confirmed{background:var(--ok-bg);color:var(--ok-fg)}
.chip.estimated{background:var(--est-bg);color:var(--est-fg);border:1px solid var(--est-line)}
.chip.missing{background:var(--miss-bg);color:var(--miss-fg);border:1px solid var(--miss-line)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.src{font-size:11.5px;color:var(--muted);max-width:280px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.todo .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.sev-high .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--miss-fg);margin-right:6px}
.sev-med .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--est-line);margin-right:6px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.floors td input{width:64px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:32px 16px;text-align:center;background:var(--surface);display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--brand-soft)}
.steps{display:grid;gap:6px;max-width:520px;margin:0 auto;text-align:left}
.step{display:flex;gap:8px;align-items:center}
.step .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.step.on .dot{background:var(--est-line);animation:pulse 1s infinite alternate}
.step.done .dot{background:var(--accent)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.step.on .dot{animation:none}}
.notice{border-radius:6px;padding:10px 12px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.notice.warn{background:var(--est-bg);color:var(--est-fg)}
.notice.bad{background:var(--miss-bg);color:var(--miss-fg)}
.client{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.client .band{background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.client .band b{font-family:var(--font-display);font-size:24px;letter-spacing:.04em}
.client .body{padding:12px 14px;display:grid;gap:10px}
.client ul{margin:2px 0 0;padding-left:18px}
.totals td{border:0;padding:3px 8px}
.totals tr.grand td{font-family:var(--font-display);font-size:20px;font-weight:700;border-top:2px solid var(--fg)}
.phase{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.phase ul{margin:0;padding-left:18px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.empty{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.sec td{background:var(--surface2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
details summary{cursor:pointer;font-weight:600}
.sheet{background:#fff;color:#15211a;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:11px}
.sheet-hd{background:#143f27;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px;font-family:var(--font-display);letter-spacing:.06em}
.sheet-hd b{font-size:20px}.sheet-hd span:nth-child(2){font-size:16px;font-weight:700}
.sheet-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px}
.sheet-info div{background:#f2f6f2;border:1px solid #c8d2ca;border-radius:4px;padding:4px 7px;min-width:0}
.sheet-info span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:#1b5e38;font-weight:700}
.sheet-info b{font-family:var(--font-display);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 10px 10px}
@media (max-width:560px){.sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pv-ch{background:#143f27;color:#fff;font-weight:700;font-size:9px;letter-spacing:.1em;padding:4px 6px;border-radius:3px}
.pv-dsh{color:#1b5e38;font-weight:700;font-size:9px;letter-spacing:.06em;border-bottom:1px solid #1b5e38;margin:6px 0 2px;padding:0 2px}
.pv-dr{display:flex;justify-content:space-between;gap:4px;padding:1px 2px;font-variant-numeric:tabular-nums}
.pv-fit{position:relative;border:1px solid #c8d2ca;border-radius:4px;padding:4px 6px;margin-top:4px}
.pv-fit.ai{background:#fff2c6;border-color:#e8bf4f}
.pv-fit .q{position:absolute;top:3px;right:5px;font-weight:700}.pv-fit .q.many{color:#b91c1c;font-size:13px}
.sheet-ft{background:#143f27;color:rgba(255,255,255,.85);text-align:center;padding:6px;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--brand-soft)}
.opt.ai{box-shadow:inset 0 0 0 2px var(--est-line)}
.step.fail .dot{background:var(--miss-fg)}

.flagline{font-size:13px;padding:4px 0}
</style>
</head>
<body>

<header class="top"><div class="wrap" id="topbar"></div></header>
<div class="wrap"><main id="app"><div class="panel empty"><h2>Loading jobs and price book…</h2></div></main></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
const RATE_DEFS=[
 ['Ductwork & labour','metal_new','Metal per supply run — new build / addition','$/run'],
 ['Ductwork & labour','metal_retro','Metal per supply run — retrofit','$/run'],
 ['Ductwork & labour','lab_new','Duct labour per supply run — new build / addition','$/run'],
 ['Ductwork & labour','lab_retro','Duct labour per supply run — retrofit','$/run'],
 ['Ductwork & labour','rough_share','Rough-in share of duct labour','%'],
 ['Ductwork & labour','lab_hour','Labour cost per tech-hour','$/hr'],
 ['Ductwork & labour','tiein_hours','Equipment set & tie-in','tech-hrs'],
 ['Ductwork & labour','startup_hours','Startup & balancing','tech-hrs'],
 ['Gas, fans & vents','gas_point','Gas piping per appliance','$/each'],
 ['Gas, fans & vents','fan_supply','Exhaust fan supplied & vented','$/each'],
 ['Gas, fans & vents','fan_vent','Fan venting only (housing by others)','$/each'],
 ['Gas, fans & vents','dryer_vent','Dryer vent to exterior','$/each'],
 ['Gas, fans & vents','vent_install','ERV/HRV install & venting','$/each'],
 ['Gas, fans & vents','zone_per','Zoning per zone (damper + zone stat)','$/zone'],
 ['Gas, fans & vents','design_fee','Heating plan / heat loss','$/job'],
 ['Markups','mk_equipment','Markup — equipment','%'],
 ['Markups','mk_ductwork','Markup — metal ductwork','%'],
 ['Markups','mk_labour','Markup — labour','%'],
 ['Markups','mk_gas','Markup — gas piping','%'],
 ['Markups','mk_fans','Markup — fans & dryer vents','%'],
 ['Markups','mk_vent','Markup — ERV/HRV install','%'],
 ['Markups','mk_zoning','Markup — zoning','%'],
 ['Markups','mk_addons','Markup — add-ons (tankless, humidifier)','%'],
 ['Markups','mk_design','Markup — design','%'],
 ['Markups','hst','HST','%'],
];
const GRP={furnace:'Furnace',ac:'AC system',vent:'ERV / HRV',zoning:'Zoning system',metal:'Metal ductwork',labour:'Installation labour',gas:'Gas piping',fans:'Exhaust fans & vents',humid:'Whole-home humidifier',tankless:'Tankless water heater',design:'Heating plan & heat loss',other:'Other'};
const GRP_ORDER=['furnace','ac','vent','humid','zoning','metal','labour','gas','fans','tankless','design','other'];
const PHASES=[{key:'lab_rough',name:'Rough-in'},{key:'lab_base',name:'Basement'},{key:'lab_tiein',name:'Equipment set & tie-in'},{key:'lab_startup',name:'Startup & balancing'}];
const KINDS=['furnace','ac','ventilator','thermostat','water-heater','humidifier','zoning','fan','material','other'];
const STALE_DAYS=90;

/* ---------- state ---------- */
const S={images:{},woAll:{},rates:{},items:[],jobs:[],jobId:null,view:'job',tab:'overview',ready:{rates:false,items:false,jobs:false},db:null,sample:null,downloads:null,offline:false,busy:null,pendingRender:false,search:''};
const dirty=new Set(); const saveTimers={}; const writeChains={};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n==null||isNaN(n))?'—':(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-CA');
const money2=n=>(n==null||isNaN(n))?'—':'$'+(+n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||uid();
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const num=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isNaN(n)?null:n};
const rv=k=>S.rates[k]?.v ?? null;
const rc=k=>!!S.rates[k]?.confirmed;
const daysOld=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const curJob=()=>S.jobs.find(j=>j.id===S.jobId);
const supplyTotal=t=>(t?.floors||[]).reduce((a,f)=>a+(+f.supply||0),0);
const returnTotal=t=>(t?.floors||[]).reduce((a,f)=>a+(+f.returns||0),0);
const lineCost=l=>(l.unitCost==null||l.qty==null)?null:Math.round(l.qty*l.unitCost*100)/100;
const lineMk=l=>l.mk!=null?l.mk:(rv('mk_'+l.cat)??0);
const lineSell=l=>{const c=lineCost(l);return c==null?null:Math.round(c*(1+lineMk(l)/100))};
const lineStatus=l=>l.unitCost==null?'missing':(l.status||'estimated');
function totals(job){let cost=0,sell=0,est=0,miss=0;(job.lines||[]).forEach(l=>{if(!l.include)return;const st=lineStatus(l);if(st==='missing')miss++;else if(st==='estimated')est++;const c=lineCost(l);if(c!=null){cost+=c;sell+=lineSell(l)}});const hst=rv('hst')??13;return{cost,sell,est,miss,margin:sell?(sell-cost)/sell:0,hst:sell*hst/100,total:sell*(1+hst/100)}}

/* ---------- persistence ---------- */
function chain(path,fn){const p=(writeChains[path]||Promise.resolve()).then(fn,fn);writeChains[path]=p.catch(()=>{});return p}
function saveJob(job){if(!job)return;job.updatedAt=new Date().toISOString();dirty.add(job.id);clearTimeout(saveTimers[job.id]);
  saveTimers[job.id]=setTimeout(()=>{if(!S.db){dirty.delete(job.id);return}const data=JSON.parse(JSON.stringify(job));delete data.id;data._kind='est_job';data._jobId=job.id;data._by=portalUser()?.username||'';
    chain('jobs/'+job.id,()=>S.db.collection('meta').doc('est_job_'+job.id).set(data)).then(()=>dirty.delete(job.id)).catch(e=>{dirty.delete(job.id);toast(e?.code==='quota_exceeded'?'Storage is full — delete old jobs to save':'Could not save the job — '+(e?.message||'try again'))})},700)}
function saveRates(){if(!S.db)return;const data={rates:JSON.parse(JSON.stringify(S.rates))};chain('settings/rates',()=>S.db.collection('meta').doc('est_rates').set(data)).catch(()=>toast('Could not save rates'))}
function saveItem(it){if(!S.db)return Promise.resolve();const data=JSON.parse(JSON.stringify(it));delete data.id;return chain('pricebook',()=>S.db.collection('meta').doc('est_pricebook').set({items:{[it.id]:data}},{merge:true})).catch(()=>toast('Could not save price book item'))}
function recordItemCost(itemId,cost,source){const it=S.items.find(i=>i.id===itemId);if(!it)return;
  if(it.cost!=null&&it.cost!==cost){it.history=[...(it.history||[]),{cost:it.cost,date:it.date||null,source:it.source||''}].slice(-25)}
  it.cost=cost;it.confirmed=true;it.source=source;it.date=today();saveItem(it)}

/* ---------- generation ---------- */
function mkLine(o){return Object.assign({qty:1,unit:'ea',include:true,mk:null,touched:false,status:'estimated',src:''},o)}
function rateLine(key,grp,cat,desc,qty,rateKey,unit,mult=1){const v=rv(rateKey);
  return mkLine({key,grp,cat,desc,qty,unit,unitCost:v==null?null:Math.round(v*mult*100)/100,rateKey,status:v==null?'missing':(rc(rateKey)?'confirmed':'estimated'),src:v==null?'No rate set — add it in Price book & rates':(S.rates[rateKey]?.src||'Rate')+(mult!==1?` × ${Math.round(mult*100)}%`:'')})}
function itemStatus(it){if(!it||it.cost==null)return 'missing';return it.confirmed?'confirmed':'estimated'}
function itemLine(key,grp,cat,it,desc){return mkLine({key,grp,cat,desc:desc||it.desc,qty:1,unit:'ea',unitCost:it.cost??null,itemId:it.id,status:itemStatus(it),src:(it.source||'Price book')+(it.date?` · ${it.date}`:'')})}
const blowerTons=sku=>{const m=String(sku).match(/[BCD](12|16|20)/);return m?{12:3,16:4,20:5}[m[1]]:null};
function furnaceDesc(it){const a=it.attrs||{};return `${it.sku} — ${a.btu?Math.round(a.btu/1000)+',000 BTU ':''}${it.desc||''}`.trim()}
function pickFurnace(f,tons,zoned){const furn=S.items.filter(i=>i.kind==='furnace');
  if(f.model){const m=furn.find(i=>norm(i.sku)===norm(f.model));if(m&&m.cost!=null)return{item:m,sub:false}}
  const btu=+f.btuInput||0;if(!btu)return{item:null};
  let c=furn.filter(i=>i.cost!=null&&+i.attrs?.btu===btu);
  const pref=zoned?['2-stage variable speed','modulating','2-stage ECM']:['2-stage variable speed','2-stage ECM','modulating'];
  for(const s of pref){const cc=c.filter(i=>i.attrs?.series===s);if(cc.length){c=cc;break}}
  if(!c.length)return{item:null};
  c.sort((a,b)=>(blowerTons(a.sku)||0)-(blowerTons(b.sku)||0));
  const fit=c.find(i=>(blowerTons(i.sku)||9)>=(tons||0))||c[c.length-1];
  return{item:fit,sub:!!f.model&&norm(fit.sku)!==norm(f.model)}}
function generateLines(job){const t=job.takeoff||{},st=job.settings||{},L=[];const retro=st.jobType==='retrofit';
  const runs=supplyTotal(t),rets=returnTotal(t),tons=+t.ac?.tons||0,zones=+t.zones||1,share=(rv('rough_share')??50)/100;
  const f=t.furnace||{};
  if(!f.existing&&(f.btuInput||f.model)){const p=pickFurnace(f,tons,zones>1);
    if(p.item)L.push(itemLine('furnace','furnace','equipment',p.item,furnaceDesc(p.item)+(p.sub?` (equivalent to spec'd ${f.model})`:'')));
    else L.push(mkLine({key:'furnace',grp:'furnace',cat:'equipment',desc:`Furnace ${f.model||''} ${f.btuInput?Math.round(f.btuInput/1000)+',000 BTU':''}`.trim(),unitCost:null,status:'missing',src:'Not in price book'}))}
  if(tons){const it=S.items.find(i=>i.kind==='ac'&&+i.attrs?.tons===tons);
    if(it)L.push(itemLine('ac','ac','equipment',it,`${tons} ton AC — condenser, coil, line set, installed${t.ac?.twoStageRequired?' (two-stage)':''}`));
    else L.push(mkLine({key:'ac',grp:'ac',cat:'equipment',desc:`${tons} ton AC — condenser, coil, line set, installed`,unitCost:null,status:'missing',src:'No AC price for this size'}))}
  const v=t.ventilator;if(v&&(v.type||v.model)){const vs=S.items.filter(i=>i.kind==='ventilator');
    const it=vs.find(i=>norm(i.sku)===norm(v.model))||vs.find(i=>(i.attrs?.type||'').toUpperCase()===(v.type||'').toUpperCase());
    if(it)L.push(itemLine('vent_unit','vent','equipment',it,`${v.type||it.attrs?.type||'ERV'} — ${it.sku} ${it.desc||''}`.trim()));
    else L.push(mkLine({key:'vent_unit',grp:'vent',cat:'equipment',desc:`${v.type||'ERV'} ${v.model||''}`.trim(),unitCost:null,status:'missing',src:'Not in price book'}));
    L.push(rateLine('vent_install','vent','vent',`${v.type||'ERV'} install, venting & control`,1,'vent_install','job'))}
  if(zones>1)L.push(rateLine('zoning','zoning','zoning',`Zoning — ${zones} zone dampers + ${zones} zone thermostats + panel`,zones,'zone_per','zone'));
  if(runs)L.push(rateLine('metal','metal','ductwork',`Metal ductwork — ${runs} supply runs, ${rets} returns, trunks per drawing${(job.master?.items||[]).length?' (see Master)':''}`,runs,retro?'metal_retro':'metal_new','run'));
  if(woHas(job,'rough'))L.push(woLine(job,'rough'));else if(runs)L.push(rateLine('lab_rough','labour','labour','Rough-in labour (ductwork, risers, exhaust, gas rough)',runs,retro?'lab_retro':'lab_new','run',share));
  if(woHas(job,'bsmt'))L.push(woLine(job,'bsmt'));else if(runs)L.push(rateLine('lab_base','labour','labour','Basement labour (trunks, returns, panning, finish)',runs,retro?'lab_retro':'lab_new','run',1-share));
  const lh=rv('lab_hour');
  [['lab_tiein','tiein_hours','Equipment set & tie-in labour'],['lab_startup','startup_hours','Startup, commissioning & balancing']].forEach(([key,hk,desc])=>{const h=rv(hk);
    L.push(mkLine({key,grp:'labour',cat:'labour',desc,qty:h??0,unit:'tech-hr',unitCost:lh,status:(lh==null||h==null)?'missing':(rc(hk)&&rc('lab_hour')?'confirmed':'estimated'),src:`${S.rates[hk]?.src||'Hours not set'} · rate ${lh==null?'not set':money(lh)+'/hr'}`}))});
  const gas=(t.gasAppliances||[]).filter(Boolean);if(gas.length)L.push(rateLine('gas','gas','gas',`Gas piping — ${gas.join(', ')}`,gas.length,'gas_point','appliance'));
  const fans=+t.fanCount||0;if(fans){const sup=st.fansSupplied!==false;L.push(rateLine('fans','fans','fans',sup?`Exhaust fans supplied & vented (×${fans})`:`Exhaust fan venting (×${fans}) — fan housings by others`,fans,sup?'fan_supply':'fan_vent','fan'))}
  const dv=+t.dryerVents||0;if(dv)L.push(rateLine('dryer','fans','fans',`Dryer vent to exterior (×${dv})`,dv,'dryer_vent','vent'));
  const ad=st.addOns||{};
  if(ad.humidifier){const it=S.items.find(i=>i.kind==='humidifier');L.push(it?itemLine('humid','humid','addons',it):mkLine({key:'humid',grp:'humid',cat:'addons',desc:'Whole-home humidifier',unitCost:null,status:'missing',src:'Not in price book'}))}
  if(ad.tankless){const it=S.items.find(i=>i.kind==='water-heater');L.push(it?itemLine('tankless','tankless','addons',it,`${it.desc} — supplied & installed, gas & venting`):mkLine({key:'tankless',grp:'tankless',cat:'addons',desc:'Tankless water heater',unitCost:null,status:'missing',src:'Not in price book'}))}
  if(ad.design)L.push(rateLine('design','design','design','Heating plan & heat loss calculations',1,'design_fee','job'));
  return L}
function rebuild(job){const old=Object.fromEntries((job.lines||[]).map(l=>[l.key,l]));const fresh=generateLines(job);
  const keep=(job.lines||[]).filter(l=>l.key.startsWith('m-'));
  job.lines=fresh.map(l=>{const o=old[l.key];if(!o)return l;const base={...l,include:o.include,mk:o.mk,sourcing:o.sourcing,supplier:o.supplier};
    if(o.touched&&!l.fromWO&&!o.fromWO&&(o.itemId||null)===(l.itemId||null))return{...base,qty:o.qty,unitCost:o.unitCost,status:o.status,touched:true,src:o.src};
    return base}).concat(keep);
  job.todos=mergeTodos(job);job.materials=mergeMaterials(job);return job}

/* ---------- to-dos ---------- */
function autoTodos(job){const t=job.takeoff||{},L=[],lines=job.lines||[];const f=t.furnace||{};
  lines.filter(l=>l.include&&lineStatus(l)==='missing').forEach(l=>L.push({id:'miss-'+l.key,text:`Get a price: ${l.desc}`,sev:'high'}));
  lines.filter(l=>l.include&&l.itemId&&lineStatus(l)==='estimated').forEach(l=>L.push({id:'est-'+l.key,text:`Confirm price: ${l.desc} (now ${money(l.unitCost)} from ${l.src})`,sev:'med'}));
  const er=lines.filter(l=>l.include&&!l.itemId&&!l.fromWO&&lineStatus(l)==='estimated');
  const mo=(job.master?.items||[]).filter(i=>i.ai&&!i.checked).length;if(!job.master)L.push({id:'m-none',text:'Build the Master from the drawing (Master tab) so the sheet metal order can go to the supplier',sev:'high'});else if(mo)L.push({id:'m-open',text:`Check ${mo} Master items Claude measured before sending to the supplier`,sev:'med'});
  (job.master?.flags||[]).forEach((x,i)=>L.push({id:'mf-'+i,text:'Master: '+x,sev:'med',from:'drawing'}));
  if(job.wo){['rough','bsmt'].forEach(t=>{const c=woCalc(job,t);if(c.aiOpen)L.push({id:'wo-'+t,text:`Check ${c.aiOpen} ${WO_DATA[t].label} work order quantities Claude counted (now ${money(c.tot)})`,sev:'med'})});(job.wo.flags||[]).forEach((x,i)=>L.push({id:'wf-'+i,text:'Work order: '+x,sev:'med',from:'drawing'}))}
  else if(supplyTotal(t))L.push({id:'wo-none',text:'Labour is from per-run rates — build the work orders from the drawing for union piece-rate labour',sev:'med'});
  if(er.length)L.push({id:'est-rates',text:`Confirm ${er.length} numbers based on past jobs (${er.map(l=>({vent_install:'ERV install',zoning:'zoning',metal:'metal',lab_rough:'rough-in labour',lab_base:'basement labour',lab_tiein:'tie-in labour',lab_startup:'startup labour',gas:'gas',fans:'fans',dryer:'dryer vents',design:'heating plan'})[l.key]||l.key).join(', ')}) — tick or change them on the Estimate tab`,sev:'med'});
  lines.filter(l=>l.include&&l.itemId).forEach(l=>{const it=S.items.find(i=>i.id===l.itemId);const d=daysOld(it?.date);
    if(it&&it.confirmed&&d!=null&&d>STALE_DAYS)L.push({id:'stale-'+it.id,text:`Re-check ${it.sku} with supplier — price is from ${it.date} (${d} days old)`,sev:'med'})});
  if(f.model&&!f.existing){const fl=lines.find(l=>l.key==='furnace');const it=fl&&S.items.find(i=>i.id===fl.itemId);
    if(it&&norm(it.sku)!==norm(f.model))L.push({id:'furn-spec',text:`Drawing specs ${f.model}. Priced ${it.sku} instead — get a price on the spec'd unit or confirm the substitute with the client`,sev:'med'})}
  if(f.existing)L.push({id:'furn-exist',text:'Drawing says the existing furnace stays — confirm whether you are relocating or replacing it',sev:'med'});
  if(t.ac?.twoStageRequired)L.push({id:'ac-2stage',text:'Drawing requires a two-stage AC (and furnace) for zoning — make sure the AC you price is two-stage',sev:'med'});
  if((t.gasAppliances||[]).length)L.push({id:'gas',text:`Confirm gas points with the builder: ${(t.gasAppliances||[]).join(', ')}`,sev:'med'});
  if(lines.some(l=>l.key==='zoning'&&l.include)&&(rv('mk_zoning')??0)===0)L.push({id:'zone-mk',text:'Zoning has gone out at cost on past jobs — set a zoning markup in Price book & rates',sev:'med'});
  if(lines.some(l=>l.key==='lab_tiein'))L.push({id:'tiein',text:'Tie-in and startup labour were never tracked on past jobs — check the hours on the Hourly work order',sev:'med'});
  if(!rc('lab_hour'))L.push({id:'labrate',text:'Set your real labour cost per tech-hour in Price book & rates — the hourly work order (tie-in, startup) uses it',sev:'med'});
  if(supplyTotal(t)&&!Object.keys(t.supplySizes||{}).length)L.push({id:'sizes',text:'Supply pipe sizes not read from the drawing — material list assumes 5" round',sev:'med'});
  (t.flags||[]).forEach((x,i)=>L.push({id:'dwg-'+i,text:x,sev:'med',from:'drawing'}));
  return L}
function mergeTodos(job){const prev=Object.fromEntries((job.todos||[]).map(t=>[t.id,t]));const auto=autoTodos(job).map(t=>({...t,auto:true,done:!!prev[t.id]?.done}));
  const ids=new Set(auto.map(t=>t.id));const manual=(job.todos||[]).filter(t=>!t.auto||(t.done&&!ids.has(t.id)&&false));
  const ai=(job.todos||[]).filter(t=>t.from==='ai');
  return [...auto,...ai.filter(t=>!ids.has(t.id)),...manual.filter(t=>t.from!=='ai')]}

/* ---------- materials ---------- */
function generateMaterials(job){const t=job.takeoff||{},M=[];const add=(sec,item,qty,unit,est,note)=>M.push({id:slug(sec+'-'+item),sec,item,qty,unit,est:!!est,note:note||''});
  (job.lines||[]).filter(l=>l.include&&l.itemId).forEach(l=>{const it=S.items.find(i=>i.id===l.itemId);if(it&&it.kind!=='ac')add('Equipment',`${it.sku} — ${it.desc||''}`,1,'ea',false)});
  if(+t.ac?.tons){add('Equipment',`${t.ac.tons} ton condenser${t.ac.twoStageRequired?' (two-stage)':''}`,1,'ea',false);add('Equipment',`${t.ac.tons} ton cased coil`,1,'ea',false);
    add('AC',`Line set 25' (${+t.ac.tons>=3.5?'3/8 x 7/8':'3/8 x 3/4'})`,1,'ea',true,'Check length on site');add('AC','Condenser pad',1,'ea',false)}
  const runs=supplyTotal(t);const hasM=(job.master?.items||[]).length>0;if(hasM)add('Sheet metal','Sheet metal per Master — send the Master PDF',1,'Master',false,(job.master.fields?.fmaster||''));let sizes=t.supplySizes&&Object.keys(t.supplySizes).length?t.supplySizes:(runs?{'5':runs}:{});
  const assumed=!(t.supplySizes&&Object.keys(t.supplySizes).length);
  if(!hasM)Object.entries(sizes).sort((a,b)=>+a[0]-+b[0]).forEach(([s,n])=>{n=+n;if(!n)return;
    add('Supply branches',`${s}" round pipe, 5' lengths`,n*3,'pc',true,'~3 lengths per run');
    add('Supply branches',`${s}" adjustable 90° elbow`,n*2,'pc',true);
    add('Supply branches',`${s}" start collar with damper`,n,'pc',assumed,'OBC: damper on every branch');
    add('Supply branches',`${s}" boot (to 4x10 / 2x12)`,n,'pc',true,'Match register sizes on site')});
  const r=returnTotal(t);if(r&&!hasM){add('Returns','Return air openings — joist lining / panning',r,'opening',true);add('Returns','Return stud drops / boots',r,'pc',true)}
  if(!hasM)(t.trunks||[]).forEach(tr=>add('Trunks & fittings',`Trunk ${tr}`,'TBD','ft',true,'Measure from drawing'));
  if(runs&&!hasM)add('Trunks & fittings','Plenum & transitions',1,'lot',true);
  const fans=+t.fanCount||0;if(fans){const fanList=t.exhaustFans||[];const by={};fanList.forEach(x=>{const s=String(x.size||'4').replace(/[^0-9]/g,'')||'4';by[s]=(by[s]||0)+1});
    if(!fanList.length)by['4']=fans;Object.entries(by).forEach(([s,n])=>add('Exhaust & dryer',`${s}" insulated flex, 25' box`,n,'box',true));
    if((job.settings||{}).fansSupplied!==false)add('Exhaust & dryer','Exhaust fans (match CFM on drawing)',fans,'ea',false,fanList.map(x=>`${x.location||''} ${x.cfm?x.cfm+' CFM':''}`.trim()).filter(Boolean).join('; '))}
  const dv=+t.dryerVents||0;if(dv)add('Exhaust & dryer','4" rigid dryer vent kit + wall cap with damper',dv,'kit',false);
  const v=t.ventilator;if(v&&(v.type||v.model)){add('Ventilation',`6" insulated flex, 25' (fresh & stale)`,2,'box',true);add('Ventilation','Exterior hoods / wall caps',2,'ea',true);add('Ventilation',`${v.type||'ERV'} wall control`,1,'ea',false)}
  const z=+t.zones||1;if(z>1){add('Zoning','Zone dampers 24V (size to trunk)',z,'ea',false,'Size from trunk schedule');add('Zoning','Zone panel',1,'ea',false);add('Zoning','Zone thermostats',z,'ea',false)}
  const gas=(t.gasAppliances||[]).length;if(gas){add('Gas & venting','½" gas shut-off valves',gas,'ea',false);add('Gas & venting','Black iron / CSST + fittings',1,'lot',true,'Measure on site')}
  const f=t.furnace||{};if((f.btuInput||f.model)&&!f.existing){add('Gas & venting',`${(+f.btuInput||0)>=100000?'3':'2'}" PVC venting kit + termination`,1,'kit',true,'Check vent length table');add('Gas & venting','Condensate pump',1,'ea',true)}
  if(runs)add('Consumables','Foil tape, mastic, screws, strapping, hangers',1,'lot',false);
  return M}
function mergeMaterials(job){const prev=Object.fromEntries((job.materials||[]).filter(m=>m.edited).map(m=>[m.id,m]));const manual=(job.materials||[]).filter(m=>m.manual);
  return generateMaterials(job).map(m=>prev[m.id]?{...m,qty:prev[m.id].qty,est:false,edited:true}:m).concat(manual)}

/* ---------- learning ---------- */
function learnFromJobs(){const done=S.jobs.filter(j=>j.status==='history'||j.status==='closed');const by={new:[],retro:[]};const mk={};
  done.forEach(j=>{const t=j.takeoff||{},runs=supplyTotal(t);const g=(j.settings?.jobType==='retrofit')?'retro':'new';
    const cost=k=>{const l=(j.lines||[]).find(x=>x.key===k);if(!l)return null;const a=j.actuals?.[k];return a!=null?a:lineCost(l)};
    const metal=cost('metal'),lab=(cost('lab_rough')||0)+(cost('lab_base')||0);
    if(runs&&metal)by[g].push({job:j.address,runs,metal:metal/runs,lab:lab?lab/runs:null,actual:j.actuals?.metal!=null});
    (j.lines||[]).forEach(l=>{const c=lineCost(l);if(l.sold!=null&&c){(mk[l.cat]=mk[l.cat]||{c:0,s:0,n:0});mk[l.cat].c+=c;mk[l.cat].s+=l.sold;mk[l.cat].n++}})});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const adj={};S.jobs.forEach(j=>(j.adjustments||[]).forEach(a=>{if(!a.from)return;(adj[a.key]=adj[a.key]||[]).push(a.to/a.from)}));
  return{by,avg,mk,adj,count:done.length}}


/* ---------- portal AI proxy ---------- */
function portalUser(){try{return window.parent&&window.parent!==window?window.parent.CURRENT_USER:null}catch(e){return null}}
function aiHeaders(){const h={'content-type':'application/json'};const u=portalUser();if(u&&u.username&&u.passwordHash){h['x-ea-user']=u.username;h['x-ea-key']=u.passwordHash}return h}
async function callClaude(body){const urls=['/api/claude-proxy','/.netlify/functions/claude-proxy'];let last;
  for(const url of urls){let r;try{r=await fetch(url,{method:'POST',headers:aiHeaders(),body:JSON.stringify(body)})}catch(e){last=e;continue}
    if(r.status===404){last=new Error('AI proxy not found');continue}const d=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error((d.error&&d.error.message)||('AI error '+r.status));e.code=r.status===429||r.status===529?'rate_limited':r.status===401?'not_granted':'ai_error';throw e}return d}
  throw last||new Error('Could not reach the AI proxy')}
async function claudeJSON(prompt,images,model){const content=(images||[]).map(b64=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}}));content.push({type:'text',text:prompt});
  const d=await callClaude({model:model||'claude-opus-5-5',max_tokens:16000,messages:[{role:'user',content}]});
  const text=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');const m=text.match(/\{[\s\S]*\}/);if(!m){const e=new Error('No answer came back. Try again.');e.code='invalid_json';throw e}
  try{return JSON.parse(m[0])}catch(x){const e=new Error('Claude returned something that was not readable. Try again.');e.code='invalid_json';throw e}}

/* ---------- AI drawing reader ---------- */
const READ_PROMPT=`You are reading a residential HVAC heating drawing (Ontario, OBC) for an HVAC contractor who will price the job. The images are the drawing pages in order; extracted PDF text follows when available.
Return ONLY JSON in exactly this shape (use null when the drawing does not say; never invent model numbers):
{"project":{"address":str|null,"city":str|null,"client":str|null,"sqft":num|null,"designer":str|null,"drawingNo":str|null,"date":str|null},
 "jobType":"new"|"addition"|"retrofit",
 "furnace":{"model":str|null,"btuInput":num|null,"btuOutput":num|null,"cfm":num|null,"existing":bool},
 "ac":{"tons":num|null,"model":str|null,"twoStageRequired":bool},
 "ventilator":{"type":"ERV"|"HRV"|null,"model":str|null,"cfm":num|null},
 "waterHeater":{"type":str|null,"model":str|null}|null,
 "zones":num,
 "floors":[{"name":str,"supply":num,"returns":num,"fans":num}],
 "supplySizes":{"4":num,"5":num,"6":num,...},
 "trunks":[str],
 "exhaustFans":[{"location":str,"cfm":num|null,"size":str|null}],
 "fanCount":num,
 "dryerVents":num,
 "gasAppliances":[str],
 "notes":[str],
 "flags":[str]}
Rules:
- If the drawing has a summary table of supply/return/fan counts per floor (e.g. a FUR-1 table), use it. Otherwise count numbered supply outlets per floor and returns marked R (1R, R1, etc.). Count each outlet once even if a number appears on two sheets as a riser.
- supplySizes: count of supply outlets by round diameter in inches. If the drawing says "assume 5in unless noted", count unmarked outlets as 5.
- trunks: each trunk/riser label with its sizes, e.g. "A — 22x10 or 30x8".
- fanCount includes bathroom, powder room, laundry and kitchen exhaust fans (not dryer vents). Include the principal exhaust fan.
- gasAppliances: furnace plus any gas fireplace, range/stove, BBQ, water heater, dryer shown or noted. Short names.
- jobType: "retrofit" if existing house/existing furnace to remain; "addition" if the title says additions to existing; else "new".
- twoStageRequired true when notes require two-stage AC for zoning.
- notes: the design notes that change price or scope (insulation, sealing class, dampers, motor requirements), short.
- flags: anything the estimator must check — missing outlet numbers, counts that disagree between sheets, equipment not scheduled, unusual items (fireplaces, second kitchens, roof exhausts). Short, specific.`;
function fitJpeg(src,edge,q){const k=Math.min(1,edge/Math.max(src.width,src.height));const c=document.createElement('canvas');c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q).split(',')[1]}
async function pdfToImages(file,max,onPage){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const out=[];let text='';
  for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);
    try{const tc=await page.getTextContent();text+=`\n--- page ${p} ---\n`+tc.items.map(i=>i.str).join(' ')}catch(e){}
    if(out.length<max){const vp=page.getViewport({scale:1});const v2=page.getViewport({scale:Math.min(2000/Math.max(vp.width,vp.height),4)});
      const c=document.createElement('canvas');c.width=Math.round(v2.width);c.height=Math.round(v2.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:ctx,viewport:v2}).promise;out.push(c)}
    onPage&&onPage(p,pdf.numPages)}
  return{images:out,text,pages:pdf.numPages}}
async function fileCanvas(f){const img=new Image();img.src=URL.createObjectURL(f);await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return c}
async function prepPages(files,onMsg){const max=8;let canv=[],text='',pages=0;
  for(const f of files){if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(!window.pdfjsLib)throw new Error('The PDF reader did not load — check your connection.');
      const r=await pdfToImages(f,max-canv.length,(p,n)=>onMsg(`Rendering sheet ${p} of ${n}`));canv.push(...r.images);text+=r.text;pages+=r.pages}
    else if(/^image\//.test(f.type)&&canv.length<max){canv.push(await fileCanvas(f));pages++}}

function mDesc(it){const v1=it.v1||'',v2=it.v2||'',v3=it.v3||'',v4=it.v4||'',v5=it.v5||'',vt=it.vType||'';
  switch(it.type){
   case 'duct':return `Duct ${v1}"×${v2}"${v3?` — ${v3}'`:''}`;
   case 'blockend':return `Block End ${v1}"×${v2}"`;
   case 'pipe':return `${v1}" Pipe${v3?` — ${v3}'`:''}`;
   case 'pipeblockend':return `Block End ${v1}" Pipe`;
   case 'elbow':return `${v1}" Elbow`;
   case 'boot':return `${v1}" ${v2} Boot`;
   case 'takeoff':return `${v1}" ${v2||'TTO'}`;
   case 'fitting':if(!vt)return'Fitting (type not set)';
     if(/Y/.test(vt)&&vt!=='RA Boot')return `${vt} — ${v1||'?'} / ${v2||'?'} / ${v3||'?'}`;
     if(/Taper|90/.test(vt))return `${vt} ${v1||'?'}"×${v2||'?'}"${v4||v5?` → ${v4||'?'}"×${v5||'?'}"`:''}`;
     if(/PTO/.test(vt))return `${vt}${v3?' '+v3+' Side':''} ${v1}${v2?'"×'+v2+'"':'"'}`;
     return `${vt} ${v1}${v2?'"×'+v2+'"':v1?'"':''}`;
   case 'extra':
     if(v1==='Reducer'&&v2&&v3)return `Reducer ${v2}"→${v3}"`;
     if(v1==='Insulated Flex'&&v2)return `Insulated Flex ${v2}" — ${v3||1} × 25' box`;
     if(v1==='Damper'&&v2)return `Damper ${v2}`;
     if(v1==='Custom')return v2||'Custom';
     if(v1==='Joist Lining'&&v2)return `Joist Lining ${v2} × ${v3||'48"'}`;
     return v1+(v2?' '+v2:'');}
  return ''}
function mAgg(m){const A={fit:[],duct:{},pipe:{},flex:{},extras:{},blk:{},elb:{},cleat:{},jl:{},b5:{},b6:{},dmp:{},tto:{},sto:{}};const add=(o,k,v)=>o[k]=(o[k]||0)+v;
  (m?.items||[]).forEach(it=>{const q=n2(it.qty)||1;switch(it.type){
   case 'fitting':A.fit.push(it);break;
   case 'duct':add(A.duct,`${it.v1}×${it.v2}`,n2(it.v3)*q);break;
   case 'blockend':add(A.blk,`${it.v1}×${it.v2}`,q);break;
   case 'pipe':add(A.pipe,`${it.v1}"`,n2(it.v3)*q);break;
   case 'pipeblockend':add(A.blk,`${it.v1}" pipe`,q);break;
   case 'elbow':add(A.elb,`${it.v1}"`,q);break;
   case 'boot':add(n2(it.v1)<=5?A.b5:A.b6,`${it.v1}" ${it.v2||''}`.trim(),q);break;
   case 'takeoff':add((it.v2||'TTO')==='STO'?A.sto:A.tto,`${it.v1}"`,q);break;
   case 'extra':{const v1=it.v1||'';if(v1==='S-Cleat')add(A.cleat,'S-CLEAT',q);else if(v1==='D-Cleat')add(A.cleat,'D-CLEAT',q);
     else if(v1==='Joist Lining')add(A.jl,`${it.v2||''} × ${it.v3||'48"'}`,q);else if(v1==='Damper')add(A.dmp,it.v2||'Damper',q);
     else if(/Flex/.test(v1))add(A.flex,mDesc(it),q);else add(A.extras,mDesc(it),q);break}}});
  return A}
const fmtLF=v=>(Math.round(v*10)/10)+"'";
function masterCols(m){const A=mAgg(m);const E=o=>Object.entries(o).filter(([,v])=>v>0);

async function startRead(files){if(!S.ai){S.busy={error:'Reading drawings needs you signed in to the portal. Use "Start a job without a drawing" to type the takeoff.'};S.forceRender=true;render();return}
  const st={name:files.map(f=>f.name).join(', '),phase:'render',msg:'',parts:{takeoff:'wait',master:'wait',wo:'wait'},errs:{}};S.busy=st;S.view='new';S.forceRender=true;render();
  try{const P=await prepPages(files,m=>{st.msg=m;render()});st.phase='ai';st.msg='';render();
    const out=await runParts(P,null,['takeoff','master','wo'],(k,v,err)=>{st.parts[k]=v;if(err)st.errs[k]=err;render()});
    if(!out.takeoff.ok)throw out.takeoff.e;const d=out.takeoff.d;
    const job=newJob(takeoffFromAI(d),['new','addition','retrofit'].includes(d.jobType)?d.jobType:'new',`Read from ${files[0].name} · ${today()}`);
    if(out.master.ok)job.master=masterFromAI(out.master.d);if(out.wo.ok)job.wo=woFromAI(out.wo.d);
    if(job.master){const f=job.master.fields;f.ffurnace=f.ffurnace||job.takeoff.furnace?.model||'';f.fac=f.fac||(job.takeoff.ac?.tons?job.takeoff.ac.tons+' ton':'')}
    if(job.wo){job.wo.fields.model=job.wo.fields.model||job.master?.fields?.fmodel||''}
    rebuild(job);S.images[job.id]=P;
    ['master','wo'].forEach(k=>{if(!out[k].ok)job.todos.push({id:'fail-'+k,text:`Claude could not build the ${k==='wo'?'work orders':'Master'} (${st.errs[k]}) — re-read the drawing from the ${k==='wo'?'Work orders':'Master'} tab`,sev:'high',done:false})});
    S.jobs.push(job);S.jobId=job.id;S.view='job';S.tab='overview';S.busy=null;saveJob(job);S.forceRender=true;render();toast('Estimate, Master and work orders built — work through the to-dos')}
  catch(e){S.busy={error:'Could not read the drawing — '+aiErr(e)};S.forceRender=true;render()}}

function applyPortalPrices(p){if(!p)return;try{
  if(p.rough_ra)ROUGH_RA=p.rough_ra;if(p.rough_du)ROUGH_DU=p.rough_du;if(p.rough_vl)ROUGH_VL=p.rough_vl;if(p.rough_vr)ROUGH_VR=p.rough_vr;if(p.rough_o)ROUGH_O=p.rough_o;
  if(p.bsmt_sa)BSMT_SA=p.bsmt_sa;if(p.bsmt_ra)BSMT_RA=p.bsmt_ra;if(p.bsmt_el)BSMT_EL=p.bsmt_el;if(p.bsmt_er)BSMT_ER=p.bsmt_er;if(p.bsmt_o)BSMT_O=p.bsmt_o;
  if(p.rates){['standard','custom'].forEach(k=>{if(p.rates[k]&&WO_TIERS[k])WO_TIERS[k]={...WO_TIERS[k],rr:+p.rates[k].rr||WO_TIERS[k].rr,rb:+p.rates[k].rb||WO_TIERS[k].rb}})}
  if(p.vehPct!=null)S.defVeh=parseFloat(p.vehPct)||3.5;
  WO_DATA.rough.secs=[['ra','Return Air',ROUGH_RA],['du','Ducted R/A & S/A',ROUGH_DU],['vc1','Vents & Exhaust',ROUGH_VL],['vc2','Vents, HRV & Extras',ROUGH_VR]];WO_DATA.rough.opts=ROUGH_O;
  WO_DATA.bsmt.secs=[['bsa','Supply Air',BSMT_SA],['bra','Return Air',BSMT_RA],['bec1','Extras',BSMT_EL],['bec2','Extras (more)',BSMT_ER]];WO_DATA.bsmt.opts=BSMT_O;
  S.livePrices=true;S.jobs.forEach(j=>{if(j.wo){syncWOLines(j)}});S.forceRender=true;render()}catch(e){console.warn('[Estimator] prices',e)}}
async function loadPortalExamples(db){try{const ms=await db.collection('saved_masters').limit(40).get();const out=[];
    ms.forEach(d=>{const x=d.data()||{};if(x._deleted)return;const fd=(x.snapshot&&x.snapshot._formData)||x.formData||(x.items?x:null);if(!fd||!fd.items||fd.items.length<6)return;const f=fd.fields||{};
      out.push({label:`saved Master ${x._key||x.num||d.id} (model ${f.fmodel||x.model||'?'}, builder ${f.fname||x.builder||'?'})`,items:fd.items,at:x._savedAt||''})});
    out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));S.portalMasters=out.slice(0,6)}catch(e){console.warn('[Estimator] masters',e)}
  try{const ws=await db.collection('saved_workorder').limit(60).get();const out=[];ws.forEach(d=>{const x=d.data()||{};if(x._deleted)return;const sn=x.snapshot||{};const t=sn.type||x.type;if((t!=='rough'&&t!=='bsmt')||!sn.rows)return;
      out.push({type:t,rows:sn.rows,opts:sn.opts||[],num:x.num||x._key||d.id,model:sn.fm||'',builder:sn.fb||x.builder||'',at:x._savedAt||''})});out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));S.portalWOs=out}catch(e){console.warn('[Estimator] WOs',e)}
  S.forceRender=true;render()}
async function seedIfEmpty(db){const r=await db.collection('meta').doc('est_rates').get();S.needsImport=!r.exists}
async function importData(file){if(!S.db){toast('Not connected to the database');return}let d;try{d=JSON.parse(await file.text())}catch(e){toast('That file is not an estimator data file');return}
  if(!d||!d.rates||!d.items||!d.jobs){toast('That file is missing rates, price book or jobs');return}
  try{const db=S.db,b=db.batch();b.set(db.collection('meta').doc('est_rates'),{rates:d.rates,_importedAt:new Date().toISOString()});b.set(db.collection('meta').doc('est_pricebook'),{items:d.items});
    Object.entries(d.jobs).forEach(([id,j])=>b.set(db.collection('meta').doc('est_job_'+id),{...j,_kind:'est_job',_jobId:id}));await b.commit();S.needsImport=false;S.forceRender=true;render();toast(`Loaded ${Object.keys(d.items).length} prices and ${Object.keys(d.jobs).length} jobs`)}
  catch(e){toast(e&&e.code==='read-only'?'Saving is off in this preview':'Import failed — '+(e.message||e))}}
function exportData(){const items={};S.items.forEach(({id,...v})=>items[id]=v);const jobs={};S.jobs.forEach(({id,...v})=>jobs[id]=v);
  save(`estimator-backup-${today()}.json`,new Blob([JSON.stringify({rates:S.rates,items,jobs},null,1)],{type:'application/json'}))}
let _fbStarted=false;
function parentDB(){try{return window.parent&&window.parent!==window&&window.parent.DB||null}catch(e){return null}}
function startFirestore(cfg){if(_fbStarted)return;let db=parentDB();
  if(!db){if(!cfg)return;try{if(typeof cfg==='string')cfg=JSON.parse(cfg)}catch(e){return}if(!cfg||!cfg.apiKey||!window.firebase)return;let app;try{app=firebase.app('eco_estimator')}catch(e){}if(!app)app=firebase.initializeApp(cfg,'eco_estimator');db=firebase.firestore(app)}
  _fbStarted=true;S.db=db;S.offline=false;
  const timer=setTimeout(()=>{if(!S.ready.jobs){S.ready.jobs=true;S.forceRender=true;render();toast('Still loading saved jobs…')}},10000);
  const done=k=>{S.ready[k]=true;if(S.ready.jobs)clearTimeout(timer)};
  seedIfEmpty(db).catch(()=>{}).finally(()=>{
    db.collection('meta').doc('est_rates').onSnapshot(s=>{S.rates=s.exists?(s.data().rates||{}):{};done('rates');buildPending();render()},()=>{done('rates');render()});
    db.collection('meta').doc('est_pricebook').onSnapshot(s=>{const it=s.exists?(s.data().items||{}):{};S.items=Object.entries(it).map(([id,v])=>({id,...v}));done('items');buildPending();render()},()=>{done('items');render()});
    db.collection('meta').where('_kind','==','est_job').onSnapshot(s=>{const incoming=s.docs.map(d=>{const x=d.data();const id=x._jobId||d.id.replace(/^est_job_/,'');delete x._kind;delete x._jobId;delete x._by;return{id,...x}});const local=Object.fromEntries(S.jobs.map(j=>[j.id,j]));
      S.jobs=incoming.map(j=>dirty.has(j.id)&&local[j.id]?local[j.id]:j).concat(S.jobs.filter(j=>dirty.has(j.id)&&!incoming.some(x=>x.id===j.id)));
      buildPending();
      if(!S.jobId){const recent=S.jobs.filter(j=>j.status!=='history').sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''))[0];if(recent)S.jobId=recent.id}
      done('jobs');render()},e=>{done('jobs');toast('Could not load jobs — '+e.message);render()});
    loadPortalExamples(db)})}
window.addEventListener('message',e=>{const d=e.data;if(!d||!d.__portalMsg)return;if(d.type==='PORTAL_DATA'){if(d.fbconfig)startFirestore(d.fbconfig);if(d.prices)applyPortalPrices(d.prices)}});
S.ai=!!portalUser();S.downloads=true;
(function(){startFirestore(null);let local=null;try{local=localStorage.getItem('ea_fbconfig')}catch(e){}if(local)startFirestore(local);
  try{window.parent.postMessage({__portalMsg:true,type:'REQUEST_DATA'},'*')}catch(e){}
  setTimeout(()=>{if(!_fbStarted){S.offline=true;S.ready={rates:true,items:true,jobs:true};S.forceRender=true;render()}},8000)})();
</script>
